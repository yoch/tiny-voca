name: Vocoder DSP

on:
  pull_request:
    paths:
      - '.github/workflows/vocoder-dsp.yml'
      - 'src/tiny_voca/vocoder_dsp.*'
      - 'web/build_dsp.sh'
      - 'web/public/**'
      - 'tests/dsp/**'
      - 'scripts/e04c/**'

permissions:
  contents: read

jobs:
  dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native C capacity, concurrency and sanitizer checks
        run: bash tests/dsp/run.sh
      - name: Build and test the WASM ABI and reusable arena
        run: |
          python -m pip install ziglang==0.15.1
          bash web/build_dsp.sh "$RUNNER_TEMP/dsp.wasm"
          TINY_VOCA_TEST_WASM="$RUNNER_TEMP/dsp.wasm" node --test tests/dsp/wasm.cjs
          node --check web/public/worker.js
          node --check scripts/e04c/browser.cjs
          python -m compileall -q scripts/e04c
